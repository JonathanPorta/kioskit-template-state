name: Kioskit publish

# Thin caller for the public reusable publisher
# (https://github.com/JonathanPorta/kioskit-publish). All logic lives in the
# pinned workflow. The pin MUST equal the SHA in the Kioskit Worker's
# PUBLISH_ALLOWED_WORKFLOW_REFS, or every publish is denied. No secrets.

on:
  push:
    branches: [main] # the repository's default branch

permissions: {}

jobs:
  publish:
    # Assignments are constrained to the default branch (kioskit #70).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    uses: JonathanPorta/kioskit-publish/.github/workflows/kioskit-publish.yml@9903e6fdeb89999d5fcb188ec7cc57d8049c14c3
