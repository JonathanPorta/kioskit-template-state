# blessed/repo/v1
# Repo-local manifest (blessed-cicd templates/blessed.yml). Declares what this
# repository is and which blessed standards it adopts.
#
# kioskit-template-state is the starter state repository that tenants copy with
# GitHub's "Use this template". It holds a directory skeleton, a README and two
# thin workflow callers for the public JonathanPorta/kioskit-publish workflow.
# It builds, packages and deploys nothing, and has no Makefile, so the
# make-capable defaults in blessed policy/adoption.yml don't apply.
#
# COPIES: a repository made from this template inherits this file, but it
# describes the template, not the copy. Delete it from your copy, or replace it
# with your own manifest if you adopt blessed-cicd.

schema: blessed/repo/v1

project: kioskit
component: kioskit-template-state
repo_type: docs-only
stage: prototype

stack:
  - github-actions

standards: []

capabilities:
  # Both callers pin JonathanPorta/kioskit-publish by full commit SHA, the same
  # SHA the Kioskit Worker allowlists. No other action is referenced.
  - sha-pinning

tracked_dependencies:
  blessed_scripts:
    bws: null
    ruam: null

waivers: []

exceptions: []   # legacy alias only; prefer `waivers`

notes: |
  Approved design: kioskit tasks/phase-3/prd-public-publisher.md (#137, AC-11).
  Callers, upgrading and the trust model: the kioskit-publish README.
  Repository protection: none yet. The repository becomes public after this
  lands (#137 Q6); a main ruleset is the owner's to add.
